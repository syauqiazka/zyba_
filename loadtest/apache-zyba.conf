# ─── /etc/apache2/sites-available/zyba.conf ──────────────────────────────────
# Apache reverse-proxy config for ZYBA (jhic.zyba.my.id → container:30000)
#
# Perubahan dari default:
#  1. Aktifkan mod_deflate (gzip) — Next.js compress=false, Apache yang handle
#  2. Aktifkan mod_brotli (opsional, lebih baik dari gzip)
#  3. Cache statik _next/static dengan immutable header
#  4. KeepAlive 300s supaya koneksi persistent ke browser
#  5. Timeout turun ke 60s (default 300s terlalu lama, container bisa idle)
#  6. Header keamanan tambahan
#  7. Health-check endpoint bypass ke backend tanpa logging
#
# Aktifkan modul:
#   sudo a2enmod proxy proxy_http deflate brotli headers expires rewrite
#   sudo a2ensite zyba.conf
#   sudo systemctl reload apache2
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName jhic.zyba.my.id
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ── HTTPS main vhost ─────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName jhic.zyba.my.id

    # ── SSL (sesuaikan path ke sertifikat kamu) ──────────────────────────────
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/jhic.zyba.my.id/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/jhic.zyba.my.id/privkey.pem
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off

    # ── KeepAlive ─────────────────────────────────────────────────────────────
    KeepAlive On
    KeepAliveTimeout 300
    MaxKeepAliveRequests 200

    # ── Timeouts ──────────────────────────────────────────────────────────────
    Timeout 60
    ProxyTimeout 60

    # ── Proxy ke Next.js container ───────────────────────────────────────────
    ProxyPreserveHost On
    ProxyPass        /api/health  http://127.0.0.1:30000/api/health  nocanon
    ProxyPassReverse /api/health  http://127.0.0.1:30000/api/health

    ProxyPass        /  http://127.0.0.1:30000/  nocanon
    ProxyPassReverse /  http://127.0.0.1:30000/

    # Forward IP asli ke Next.js
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # ── Kompresi — Apache menggantikan Next.js compress:false ────────────────
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS \
            text/html text/css text/javascript application/javascript \
            application/json text/xml application/xml image/svg+xml \
            font/woff2 font/woff
        BrotliFilterNote ratio
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE \
            text/html text/css text/javascript application/javascript \
            application/json text/xml application/xml image/svg+xml \
            font/woff2 font/woff
        DeflateCompressionLevel 6
    </IfModule>

    # ── Static asset cache (_next/static = immutable oleh Next.js) ───────────
    # Apache hanya perlu mempertahankan header yg sudah di-set Next.js.
    # Jika Next.js tidak mengirim Cache-Control untuk static, set di sini:
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # ── Security headers ──────────────────────────────────────────────────────
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set Permissions-Policy        "geolocation=(), microphone=(), camera=()"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # ── Jangan log health-check probe ────────────────────────────────────────
    SetEnvIf Request_URI "^/api/health" nolog
    CustomLog ${APACHE_LOG_DIR}/zyba_access.log combined env=!nolog
    ErrorLog  ${APACHE_LOG_DIR}/zyba_error.log

    # ── Buffer upstream response ──────────────────────────────────────────────
    # Cegah slow-client dari menahan koneksi ke Node.js
    ProxyReceiveBufferSize 8192

</VirtualHost>
